# SatQuery AI — Oracle Cloud Free VM production compose
# Usage:  docker compose -f docker-compose.prod.yml up -d
#
# ── What this removes vs docker-compose.yml ────────────────────────────────
#  • MinIO / minio-init  → replaced by local filesystem storage (STORAGE_BACKEND=local)
#  • Docker secrets      → replaced by plain env_file (.env.prod) for simplicity
#  • Resource limits     → removed (Oracle ARM has 24 GB, no need to cap)
#  • Gunicorn workers    → 2 (balanced for 4 ARM CPUs, leaves room for worker)
# ───────────────────────────────────────────────────────────────────────────

services:
  nginx:
    image: nginx:alpine
    container_name: satquery_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery_migrate
    command: alembic upgrade head
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://satquery:satquery_secure_pass_2026@db:5432/satquery_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery_api
    expose:
      - "8000"
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://satquery:satquery_secure_pass_2026@db:5432/satquery_db
    volumes:
      - satquery_data:/app/data
      - ./data/weights:/app/data/weights:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery_worker
    command: python -m app.workers.query_worker
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://satquery:satquery_secure_pass_2026@db:5432/satquery_db
    volumes:
      - satquery_data:/app/data
      - ./data/weights:/app/data/weights:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery_frontend
    expose:
      - "3000"
    env_file:
      - .env.prod
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: satquery_db
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery_secure_pass_2026
      POSTGRES_DB: satquery_db
    ports:
      - "127.0.0.1:5432:5432"   # bind only to loopback — not exposed publicly
    volumes:
      - satquery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: satquery_redis
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "127.0.0.1:6379:6379"   # bind only to loopback
    volumes:
      - satquery_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  satquery_pgdata:
  satquery_data:
  satquery_redisdata:
